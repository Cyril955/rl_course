env:
  name: Acrobot-v1

expert:
  dataset_path: data/iq_format/Acrobot-v1/expert_K10_seed0.pkl
  num_trajectories: 10

training:
  seed: 0
  total_steps: 100000
  batch_size: 32
  gamma: 0.99
  learning_rate: 0.0001
  entropy_coef: 0.01

model:
  hidden_dim: 64
  hidden_layers: 2

output:
  save_dir: models/iq_learn/Acrobot-v1/K10_seed0
  log_dir: results/raw/iq_learn/Acrobot-v1/K10_seed0